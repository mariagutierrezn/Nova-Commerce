services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: nova-mongodb-backend
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: nova_db
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nova-backend-network

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: nova-rabbitmq-backend
    ports:
      - "5672:5672"    # AMQP protocol
      - "15672:15672"  # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: nova
      RABBITMQ_DEFAULT_PASS: nova123
      RABBITMQ_DEFAULT_VHOST: /nova
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nova-backend-network

  # Auth Service
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: auth-service
        SERVICE_PORT: 8081
    container_name: nova-auth-service
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/nova_db
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: nova
      SPRING_RABBITMQ_PASSWORD: nova123
      SPRING_RABBITMQ_VIRTUAL_HOST: /nova
      JWT_SECRET: E8F7D6C4B5A3F2E1D9C8B7A6F5E4D3C2B1A0F9E8D7C6B5A4F3E2D1C0B9A8F7E6D5C4B3A2F1E0D9C8B7A6F5E4D3C2B1A0F9E8D7C6B5A4
      INTERNAL_API_KEY: nova-internal-service-key-2024
      USER_SERVICE_URL: http://user-service:8082
      CUSTOMER_SERVICE_URL: http://customer-service:8084
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - nova-backend-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # User Service
  user-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: user-service
        SERVICE_PORT: 8082
    container_name: nova-user-service
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/nova_db
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: nova
      SPRING_RABBITMQ_PASSWORD: nova123
      SPRING_RABBITMQ_VIRTUAL_HOST: /nova
      JWT_SECRET: E8F7D6C4B5A3F2E1D9C8B7A6F5E4D3C2B1A0F9E8D7C6B5A4F3E2D1C0B9A8F7E6D5C4B3A2F1E0D9C8B7A6F5E4D3C2B1A0F9E8D7C6B5A4
      INTERNAL_API_KEY: nova-internal-service-key-2024
      SEED_ENABLED: "true"
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - nova-backend-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8082/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Customer Service
  customer-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: customer-service
        SERVICE_PORT: 8084
    container_name: nova-customer-service
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/nova_db
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: nova
      SPRING_RABBITMQ_PASSWORD: nova123
      SPRING_RABBITMQ_VIRTUAL_HOST: /nova
      JWT_SECRET: E8F7D6C4B5A3F2E1D9C8B7A6F5E4D3C2B1A0F9A8D7C6B5A4F3E2D1C0B9A8F7E6D5C4B3A2F1E0D9C8B7A6F5E4D3C2B1A0F9E8D7C6B5A4
      INTERNAL_API_KEY: nova-internal-service-key-2024
      ORDER_SERVICE_URL: http://order-service:8085
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - nova-backend-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8084/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Product Service
  product-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: product-service
        SERVICE_PORT: 8083
    container_name: nova-product-service
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/nova_db
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: nova
      SPRING_RABBITMQ_PASSWORD: nova123
      SPRING_RABBITMQ_VIRTUAL_HOST: /nova
      JWT_SECRET: E8F7D6C4B5A3F2E1D9C8B7A6F5E4D3C2B1A0F9E8D7C6B5A4F3E2D1C0B9A8F7E6D5C4B3A2F1E0D9C8B7A6F5E4D3C2B1A0F9E8D7C6B5A4
      INTERNAL_API_KEY: nova-internal-service-key-2024
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - nova-backend-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8083/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Order Service
  order-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: order-service
        SERVICE_PORT: 8085
    container_name: nova-order-service
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/nova_db
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: nova
      SPRING_RABBITMQ_PASSWORD: nova123
      SPRING_RABBITMQ_VIRTUAL_HOST: /nova
      JWT_SECRET: E8F7D6C4B5A3F2E1D9C8B7A6F5E4D3C2B1A0F9E8D7C6B5A4F3E2D1C0B9A8F7E6D5C4B3A2F1E0D9C8B7A6F5E4D3C2B1A0F9E8D7C6B5A4
      INTERNAL_API_KEY: nova-internal-service-key-2024
      CUSTOMER_SERVICE_URL: http://customer-service:8084
      PRODUCT_SERVICE_URL: http://product-service:8083
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      customer-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
    networks:
      - nova-backend-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8085/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Notification Service (Worker)
  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: notification-service
        SERVICE_PORT: 8086
    container_name: nova-notification-service
    ports:
      - "8086:8086"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: nova
      SPRING_RABBITMQ_PASSWORD: nova123
      SPRING_RABBITMQ_VIRTUAL_HOST: /nova
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - nova-backend-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8086/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # API Gateway
  nova-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: nova-gateway
        SERVICE_PORT: 8080
    container_name: nova-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: E8F7D6C4B5A3F2E1D9C8B7A6F5E4D3C2B1A0F9E8D7C6B5A4F3E2D1C0B9A8F7E6D5C4B3A2F1E0D9C8B7A6F5E4D3C2B1A0F9E8D7C6B5A4
      AUTH_SERVICE_URL: http://auth-service:8081
      USER_SERVICE_URL: http://user-service:8082
      PRODUCT_SERVICE_URL: http://product-service:8083
      CUSTOMER_SERVICE_URL: http://customer-service:8084
      ORDER_SERVICE_URL: http://order-service:8085
      NOTIFICATION_SERVICE_URL: http://notification-service:8086
      GATEWAY_PUBLIC_PATHS_0: /api/auth/login
      GATEWAY_PUBLIC_PATHS_1: /api/auth/refresh
      GATEWAY_PUBLIC_PATHS_2: /api/auth/public/register
      GATEWAY_PUBLIC_PATHS_3: /api/public/**
      GATEWAY_PUBLIC_PATHS_4: /api/customers/**
      GATEWAY_PUBLIC_PATHS_5: /images/**
      GATEWAY_PUBLIC_PATHS_6: /swagger-ui/**
      GATEWAY_PUBLIC_PATHS_7: /v3/api-docs/**
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      customer-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    networks:
      - nova-backend-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  mongodb_data:
  rabbitmq_data:

networks:
  nova-backend-network:
    driver: bridge
