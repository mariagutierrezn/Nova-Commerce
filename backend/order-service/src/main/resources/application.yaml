server:
  port: 8085

spring:
  application:
    name: order-service
    description: Servicio de gestión de órdenes para Nova Commerce
    version: 1.0.0

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  banner:
    location: classpath:banner.txt
    charset: UTF-8
    mode: console

  data:
    mongodb:
      uri: mongodb://localhost:27017/nova_db

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:nova}
    password: ${SPRING_RABBITMQ_PASSWORD:nova123}
    virtual-host: ${SPRING_RABBITMQ_VIRTUAL_HOST:/nova}

  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 5000
            readTimeout: 5000
            loggerLevel: basic

# Configuración de la aplicación
app:
  name: ${APP_NAME:Order Service}
  description: ${APP_DESCRIPTION:Servicio de gestión de órdenes para Nova Commerce}
  version: ${APP_VERSION:1.0.0}
  contact:
    name: ${APP_CONTACT_NAME:Nova Commerce}
    email: ${APP_CONTACT_EMAIL:yesid.perez@sofka.com.co}
    url: ${APP_CONTACT_URL:https://novacomerce.com}

  # Configuración de JWT
  jwt:
    secret: ${JWT_SECRET:E8F7D6C4B5A3F2E1D9C8B7A6F5E4D3C2B1A0F9E8D7C6B5A4F3E2D1C0B9A8F7E6D5C4B3A2F1E0D9C8B7A6F5E4D3C2B1A0F9E8D7C6B5A4}
    internal-api-key: ${INTERNAL_API_KEY:nova-internal-service-key-2024}

  # URLs de microservicios
  services:
    customer-service:
      url: ${CUSTOMER_SERVICE_URL:http://localhost:8084}
    product-service:
      url: ${PRODUCT_SERVICE_URL:http://localhost:8083}

  # Configuración de RabbitMQ
  rabbitmq:
    exchange: nova.exchange
    routing-key:
      order-created: order.created
      order-paid: order.paid

# Configuración de OpenAPI/Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    disable-swagger-default-url: true
    doc-expansion: none
  show-actuator: false

logging:
  level:
    com.novacommerce.user_service.adapter.in.filter.InternalApiKeyFilter: DEBUG
